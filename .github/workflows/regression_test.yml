# This is a basic workflow that is manually triggered

name: regression_test

# Controls when the action will run. Triggers the workflow on push or pull
# request events for master and for the certification branch.
on:
  workflow_dispatch:
  push:
    branches: [ master, v6.4.1_cert ]
  pull_request:
    branches: [ master, v6.4.1_cert ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "linux_job"
  run_tests:
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    uses: eclipse-threadx/threadx/.github/workflows/regression_template.yml@v6.4.1_cert
    with:
      result_affix: FileX
      skip_deploy: true
  # Publishing is master's alone. The deploy job replaces the project's public
  # coverage site wholesale, so running it from any other branch would put that
  # branch's numbers up as the project's. The certification branch produces its
  # evidence as workflow artifacts instead.
  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    needs: run_tests
    uses: eclipse-threadx/threadx/.github/workflows/regression_template.yml@v6.4.1_cert
    with:
      skip_test: true
      deploy_list: FileX
